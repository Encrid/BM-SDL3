[parts.common]
name = "BM-SDL3-Common"
uses = ["sdl3"]
third_party = []

[variables]
common_probe_words = [
    "abi=2", "config=none", "pinned=true", "reloadable=false", "hot_reload=false", "scratch=4096",
    "log_ring=256", "spans=1024", "spawns=none", "changes=none", "persistent=none",
]

[[artifact]]
name = "common"
kind = "archive"
part = "common"
sources = ["src/common/*.c"]
include = ["src/common", "{sdl_root}/include", "{bridge}/include", "{bb_native}/include"]
flags = ["-fvisibility=hidden"]

[[artifact]]
name = "common_probe"
kind = "native_module"
part = "common"
test = true
sources = ["tests/common/probe/probe.c"]
include = ["src/common", "{sdl_root}/include"]
link = ["{out}/common.a", "{out}/SDL3{library}"]
flags = ["{rpath}"]
manifest = ["test:common@1.0.0", "{common_probe_words}"]

[[artifact.variants]]
name = "common_events"
defines = ["EVENTS"]

[[artifact.variants]]
name = "common_holder"
defines = ["HOLD"]
