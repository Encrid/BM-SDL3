[variables]
probe_words = [
    "abi=2", "config=test:Scene", "settings=scene module", "pinned=true", "reloadable=false",
    "scratch=8192", "log_ring=1024", "spans=4096", "spawns=none", "changes=120", "persistent=none",
    "hot_reload=false", "config.scene=none", "config.module=none",
]

[[artifact]]
name = "probe"
kind = "native_module"
test = true
sources = ["tests/probe/probe.c"]
include = ["include", "{sdl3}/include"]
link = ["{sdl3}/SDL3{library}"]
flags = ["{rpath}"]
manifest = ["test:probe@1.0.0", "{probe_words}"]

[[artifact.variants]]
name = "holder"
defines = ["HOLD"]
manifest = ["test:holder@1.0.0", "{probe_words}"]

[[artifact.variants]]
name = "detacher"
defines = ["DETACHER"]
manifest = ["test:detacher@1.0.0", "{probe_words}"]

[targets.x86_64-windows-gnu]
video_driver = "windows"
video_surface = "2"
video_metal = "0"
wayland_says = "record[3] sdl3:video@1.0.0/-: no video: wayland not available"

[targets.aarch64-windows-gnu]
video_driver = "windows"
video_surface = "2"
video_metal = "0"
wayland_says = "record[3] sdl3:video@1.0.0/-: no video: wayland not available"

[targets.x86_64-linux-gnu]
video_driver = "x11"
video_surface = "4"
video_metal = "0"
wayland_says = "record[6] test:probe@1.0.0/check: r1 surface 5 1"

[targets.aarch64-linux-gnu]
video_driver = "x11"
video_surface = "4"
video_metal = "0"
wayland_says = "record[6] test:probe@1.0.0/check: r1 surface 5 1"

[targets.x86_64-macos]
video_driver = "cocoa"
video_surface = "3"
video_metal = "1"
wayland_says = "record[3] sdl3:video@1.0.0/-: no video: wayland not available"

[targets.aarch64-macos]
video_driver = "cocoa"
video_surface = "3"
video_metal = "1"
wayland_says = "record[3] sdl3:video@1.0.0/-: no video: wayland not available"
