[project]
name = "BM-SDL3-Video"

[test]
timeout = 120
copies = 1
writers = ["bridge_native_say"]

[[style.exception]]
rule = "G4"
path = "src/video_window.c"
why = "A native module gets only its API at each call, so the window, its Metal view and the settings of the last run have no other place between two rounds."
