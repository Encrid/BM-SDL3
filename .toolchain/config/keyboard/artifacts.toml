[[artifact]]
name = "sdl3_keyboard"
kind = "native_module"
sources = ["src/*.c"]
include = ["include", "{sdl3}/include"]
link = ["{sdl3}/SDL3{library}"]
flags = ["{rpath}"]
manifest = [
    "sdl3:keyboard@1.0.0", "abi=2", "config=sdl3:KeyboardSettings", "settings=text repeat",
    "pinned=true", "reloadable=false", "hot_reload=false", "scratch=4096", "log_ring=256",
    "spans=1024", "spawns=none", "persistent=none", "changes=1120",
    "config.text=true", "config.repeat=false",
]
