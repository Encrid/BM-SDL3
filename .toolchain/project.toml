[project]
name = "BM-SDL3"

[test]
timeout = 600
copies = 1
writers = ["bridge_native_say"]

[check]
unicode = ["third_party/sdl3_linux/license"]

[ci]
needs = ["display", "gl"]

[[style.exception]]
rule = "G4"
path = "src/mouse/mouse_cursor.c"
why = "A native module gets only its API at each call, so the cursor that it made has no other place between two rounds."

[[style.exception]]
rule = "G4"
path = "src/video/video_window.c"
why = "A native module gets only its API at each call, so the window, its Metal view and the settings of the last run have no other place between two rounds."
