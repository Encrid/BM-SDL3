[[case]]
name = "with no sdl3:Cursor the module changes no cursor"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 0
line = [
    "record[6] test:probe@1.0.0/check: r1 visible 0 0",
    "record[6] test:probe@1.0.0/check: r1 relative 1 1",
]

[case.folders]
"{case}/m" = ["sdl3_mouse", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "own"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
