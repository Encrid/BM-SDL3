[[case]]
name = "the leak count names the four pairs of src/sdl3/leaks.toml"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/tests/sdl3/leaks", "--out", "{case}/out", "--leaks", "--set", "counted={root}/src/sdl3/leaks.toml", "--set", "sdl_include={root}/{sdl_root}/include", "-k", "pairs"]
claims = { status = 1, line = ["leaks: pairs keeps 1 SDL_Metal_CreateView", "leaks: pairs keeps 1 SDL_GL_CreateContext", "leaks: pairs keeps 1 SDL_CreateSystemCursor", "leaks: pairs keeps 1 SDL_GetWindows"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/tests/sdl3/leaks", "--out", "{case}/out", "--leaks", "--set", "counted={root}/src/sdl3/leaks.toml", "--set", "sdl_include={root}/{sdl_root}/include", "-k", "balanced"] }

[[case]]
name = "each give of a pair of src/sdl3/leaks.toml gives back its take"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/tests/sdl3/leaks", "--out", "{case}/out", "--leaks", "--set", "counted={root}/src/sdl3/leaks.toml", "--set", "sdl_include={root}/{sdl_root}/include", "-k", "balanced"]
claims = { status = 0, line = ["leaks: 1 cases, 1 give back what they take"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/tests/sdl3/leaks", "--out", "{case}/out", "--leaks", "--set", "counted={root}/src/sdl3/leaks.toml", "--set", "sdl_include={root}/{sdl_root}/include", "-k", "pairs"] }

[[case]]
name = "a window of either call is one sdl3_window, and SDL_DestroyWindow gives it back"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/tests/sdl3/leaks", "--out", "{case}/out", "--leaks", "--set", "counted={root}/src/sdl3/leaks.toml", "--set", "sdl_include={root}/{sdl_root}/include", "-k", "window"]
claims = { status = 1, line = ["leaks: window keeps 1 sdl3_window"] }
