[[case]]
name = "--show-config shows the words of the manifest and each default of the module"
run = ["{bridge_host}/bridge-host{exe}", "--show-config", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 0
order = [
    "module sdl3:keyboard@1.0.0, native, m/sdl3_keyboard{library}",
    'config = "sdl3:KeyboardSettings"  its file',
    'settings = "text repeat"  its file',
    "pinned = true  its file",
    "reloadable = false  its file",
    "hot_reload = false  its file",
    "scratch = 4096  its file",
    "log_ring = 256  its file",
    "spans = 1024  its file",
    'spawns = "none"  its file',
    'persistent = "none"  its file',
    "changes = 1120  its file",
    "config.text = true  its file",
    "config.repeat = false  its file",
]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/m" = ["keyboard_probe", "SDL3"]

[[case]]
name = "a key of the deployment replaces a default of the manifest"
run = ["{bridge_host}/bridge-host{exe}", "--show-config", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 0
line = ["  spans = 2048  d.toml:8"]
lacks = ["spans = 1024  its file"]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."sdl3:keyboard@1.0.0"]
spans = 2048
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
'''

