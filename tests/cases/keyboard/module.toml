[[case]]
name = "shutdown keeps SDL3 while another subsystem holds it"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 0
line = ["events still started 1"]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_holder", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["drive", "input", "check"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:holder@1.0.0"]
read = ["sdl3:Keyboard"]
'''

[case.false.folders]
"{case}/m" = ["sdl3_keyboard", "SDL3"]

[[case]]
name = "shutdown quits SDL3 after the last subsystem stops"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 0
line = ["sdl quit 1"]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
