[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
'''

[case.false.folders]
"{case}/m" = ["keyboard_probe", "SDL3"]

[[case]]
name = "an order pair names the system keys by its full name sdl3:keyboard:keys"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'test:probe@1.0.0' did not load: the [order] pair of 'sdl3:keyboard:keys' and 'test:probe:check' orders nothing: they run in different phases 0 0",
    "not loaded: m/keyboard_probe{library}: test:probe@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[order]
before = [["sdl3:keyboard:keys", "test:probe:check"]]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[order]
before = [["sdl3:keyboard:other", "test:probe:check"]]
'''
