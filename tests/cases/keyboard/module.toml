[[case]]
name = "init gives 1 and writes no video when SDL3 cannot start its video"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "nothing" }

[case.claims]
status = 1
has = ["record[3] sdl3:keyboard@1.0.0/-: no video: nothing not available"]
line = [
    "record[3] -/-: module 'sdl3:keyboard@1.0.0' did not load: its init answered 1 0 0",
    "not loaded: m/sdl3_keyboard{library}: sdl3:keyboard@1.0.0 was refused",
]

