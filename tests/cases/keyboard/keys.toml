[[case]]
name = "a key that goes down sets key and hit"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 0
line = ["record[6] test:probe@1.0.0/check: r1 key4 1 1"]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "keys"
'''

