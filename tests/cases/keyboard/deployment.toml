[[case]]
name = "a module that reads the keyboard needs the grant read sdl3:Keyboard"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'test:probe@1.0.0' did not load: it may not declare 'sdl3:Keyboard': that is another namespace's, and no grant names it 0 0",
    "not loaded: m/keyboard_probe{library}: test:probe@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = []
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
'''

[[case]]
name = "a module that writes the settings needs the grant write sdl3:KeyboardSettings"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'test:writer@1.0.0' did not load: system 'drive' may not write 'sdl3:KeyboardSettings': no grant says so 0 0",
    "not loaded: m/keyboard_writer{library}: test:writer@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_writer", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["drive", "input", "check"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:writer@1.0.0"]
read = ["sdl3:Keyboard", "sdl3:KeyboardSettings"]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["drive", "input", "check"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:writer@1.0.0"]
read = ["sdl3:Keyboard"]
write = ["sdl3:KeyboardSettings"]
'''

[[case]]
name = "content.ignore keeps the SDL3 library out of the modules"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 0
line = ["loaded: sdl3:keyboard@1.0.0, native, m/sdl3_keyboard{library}"]
lacks = ["not a module: m/SDL3{library}"]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
[backend]
native = "{bb_native}/bridge_native"
'''

[[case]]
name = "BB-Native refuses a limit of the module"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'sdl3:keyboard@1.0.0' is refused: it states work_limit, which backend 'native' cannot keep 0 0",
    "not loaded: m/sdl3_keyboard{library}: sdl3:keyboard@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."sdl3:keyboard@1.0.0"]
work_limit = 1000
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."sdl3:keyboard@1.0.0"]
work_limit = "none"
'''

[[case]]
name = "a setting of the wrong type does not load the module"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'sdl3:keyboard@1.0.0' did not load: its setting 'text' is an integer, and the field it names is a bool 0 0",
    "not loaded: m/sdl3_keyboard{library}: sdl3:keyboard@1.0.0 was refused",
    "record[6] test:probe@1.0.0/check: r1 video 0 0",
]

[case.folders]
"{case}/m" = ["sdl3_keyboard", "keyboard_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "video"
[module."sdl3:keyboard@1.0.0".config]
text = 1
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/keyboard/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "video"
[module."sdl3:keyboard@1.0.0".config]
text = true
'''
