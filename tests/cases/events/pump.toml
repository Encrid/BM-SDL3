[[case]]
name = "a writer that sets quit false keeps the run going after a quit"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 0
line = ["record[6] test:writer@1.0.0/check: r3 quit 0 0"]

[case.folders]
"{case}/m" = ["sdl3_events", "writer", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["events", "drive", "check"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:writer@1.0.0"]
read = ["sdl3:Drop"]
write = ["sdl3:EventsSettings"]
[module."test:writer@1.0.0".config]
scene = "keep"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/test.toml"]
phases = ["events", "drive", "check"]
rounds = 8
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:writer@1.0.0"]
read = ["sdl3:Drop"]
write = ["sdl3:EventsSettings"]
[module."test:writer@1.0.0".config]
scene = "quit"
'''

