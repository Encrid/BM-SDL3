[[case]]
name = "pump makes one sdl3:Drop with the path of each dropped file"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 0
line = [
    "record[6] test:probe@1.0.0/check: r2 drops 2 0",
    'record[6] test:probe@1.0.0/check: r2 drop "dropped/a.txt" 13 0',
    "record[6] test:probe@1.0.0/check: r2 drop \"dropped/caf\u00e9.txt\" 17 0",
]

[case.folders]
"{case}/m" = ["sdl3_events", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "files"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
