[[case]]
name = "init gives 1 and writes no video when SDL3 cannot start its video"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "nothing" }

[case.claims]
status = 1
has = ["record[3] sdl3:video@1.0.0/-: no video: nothing not available"]
line = [
    "record[3] -/-: module 'sdl3:video@1.0.0' did not load: its init answered 1 0 0",
    "not loaded: m/sdl3_video{library}: sdl3:video@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
'''

[case.false]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[[case]]
name = "window gives 1 and writes no window when the video driver dummy gives no surface"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
has = ["record[3] sdl3:video@1.0.0/window: no window: the video driver dummy gives no surface"]
line = [
    "record[3] sdl3:video@1.0.0/window: system 'window' failed: it answered 1 0 0",
    "record[6] test:probe@1.0.0/check: r1 state 1 0",
    "record[6] test:probe@1.0.0/check: r1 windows 0 0",
]

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[case.false]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[[case]]
name = "the video driver offscreen gives no surface"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "offscreen" }

[case.claims]
status = 1
has = ["record[3] sdl3:video@1.0.0/window: no window: the video driver offscreen gives no surface"]

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[case.false]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[[case]]
name = "window tries again at its next run when the window does not open"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
matches = ["no window: .*no window: "]

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
rounds = 1
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[[case]]
name = "max_system_failures stops the module after that many runs that do not open the window"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "dummy" }

[case.claims]
status = 1
has = ["module 'sdl3:video@1.0.0' is stopped: its system 'window' reached its max_system_failures of 3"]

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[case.false.files]
"{case}/d.toml" = '''
