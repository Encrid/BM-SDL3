'''

[[case]]
name = "a title of 64 bytes does not load the module"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'sdl3:video@1.0.0' did not load: its setting 'title' is 64 bytes of text, and the field it names holds 64 with the zero that ends it 0 0",
    "not loaded: m/sdl3_video{library}: sdl3:video@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."sdl3:video@1.0.0".config]
title = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."sdl3:video@1.0.0".config]
title = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
'''

