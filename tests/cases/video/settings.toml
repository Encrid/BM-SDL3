[[case]]
name = "title gives the title of the window"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 0
line = ['record[6] test:probe@1.0.0/check: r1 title "probe window" 12 0']

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
[module."sdl3:video@1.0.0".config]
title = "probe window"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
[module."sdl3:video@1.0.0".config]
title = "other window"
'''

