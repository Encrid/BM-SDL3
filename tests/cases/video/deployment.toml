[[case]]
name = "a module that reads the window needs the grant read sdl3:Window"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'test:probe@1.0.0' did not load: it may not declare 'sdl3:Window': that is another namespace's, and no grant names it 0 0",
    "not loaded: m/video_probe{library}: test:probe@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_video", "video_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0"]
read = ["sdl3:sdl3_place_t", "sdl3:sdl3_surface_t"]
write = ["sdl3:WindowSettings"]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
'''

