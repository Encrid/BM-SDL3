[[case]]
name = "BB-Native refuses a limit of the module"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'sdl3:video@1.0.0' is refused: it states work_limit, which backend 'native' cannot keep 0 0",
    "not loaded: m/sdl3_video{library}: sdl3:video@1.0.0 was refused",
]

[case.folders]
"{case}/m" = ["sdl3_video", "video_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."sdl3:video@1.0.0"]
work_limit = 1000
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."sdl3:video@1.0.0"]
work_limit = "none"
'''

[[case]]
name = "a setting of the wrong type does not load the module, and its shutdown stops the video"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[case.claims]
status = 1
line = [
    "record[3] -/-: module 'sdl3:video@1.0.0' did not load: its setting 'hidden' is an integer, and the field it names is a bool 0 0",
    "not loaded: m/sdl3_video{library}: sdl3:video@1.0.0 was refused",
    "record[6] test:probe@1.0.0/check: r1 video 0 0",
]

[case.folders]
"{case}/m" = ["sdl3_video", "video_probe", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "video"
[module."sdl3:video@1.0.0".config]
hidden = 1
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
