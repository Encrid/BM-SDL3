[[case]]
name = "two modules that change the window in one phase need an order pair"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]
env = { SDL_VIDEO_DRIVER = "{video_driver}" }

[case.claims]
status = 1
has = ["both touch 'sdl3:WindowSettings' in phase 'drive', one of them writing it, and no pair orders them"]

[case.folders]
"{case}/m" = ["sdl3_video", "video_probe", "video_holder", "SDL3"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:holder@1.0.0"]
read = ["sdl3:sdl3_place_t", "sdl3:sdl3_surface_t", "sdl3:Window"]
write = ["sdl3:WindowSettings"]
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/video/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:holder@1.0.0"]
read = ["sdl3:sdl3_place_t", "sdl3:sdl3_surface_t", "sdl3:Window"]
write = ["sdl3:WindowSettings"]
[order]
before = [["test:probe:drive", "test:holder:drive"]]
'''

