[[case]]
name = "the release of a target holds the module, its header and the licence, and a program builds from it"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out", "--pack"]
claims = { status = 0, order = [
    "{case}/out/BM-SDL3-Video-{target}.zip", "sdl3_video{library}", "include/sdl3_video.h", "license",
    "package proof: BM-SDL3-Video ran",
] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}", "--out", "{case}/out"] }
