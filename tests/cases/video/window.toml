[[case]]
name = "the window opens with its context of two buffers at the first run of window"
run = ["{bridge_host}/bridge-host{exe}", "{case}/d.toml"]

[case.claims]
status = 0
line = [
    "record[6] test:probe@1.0.0/check: r1 window 1 0",
    "record[6] test:probe@1.0.0/check: r1 windows 1 1",
    "record[6] test:probe@1.0.0/check: r1 double 1 0",
]

[case.folders]
"{case}/m" = ["sdl3_video", "probe", "{sdl3}/SDL3{library}"]

[case.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

[case.false.files]
"{case}/d.toml" = '''
presets = ["{root}/tests/presets/probe.toml"]
phases = ["drive", "check", "input", "present"]
[content]
paths = ["m"]
ignore = ["m/SDL3{library}"]
[backend]
native = "{bb_native}/bridge_native"
[module."test:probe@1.0.0".config]
scene = "open"
'''

